apis:
  - aid: surescripts:surescripts-medication-history-populations-fhir-api
    name: Surescripts Medication History for Populations FHIR API
    tags:
      - FHIR
      - HL7 FHIR R4
      - Medication History
      - Care Coordination
      - Prescription Notifications
    image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
    humanURL: https://docs.surescripts.com/medhistory-populations/guide
    baseURL: https://care-coordination.surescripts.net/ext/v1
    endpointsModeled: false
    properties:
      - url: https://docs.surescripts.com/medhistory-populations/guide
        type: Documentation
      - url: https://docs.surescripts.com/medhistory-populations/guide/medication-history-for-populations-element-details
        type: APIReference
      - url: https://docs.surescripts.com/medhistory-populations/guide/request-and-response-examples
        type: Documentation
      - url: https://docs.surescripts.com/medhistory-populations/guide/document-change-log
        type: ChangeLog
    description: >-
      Publicly documented HL7 FHIR Release 4 API for retrieving medication history panels and
      near-real-time Prescription Notifications for enrolled patient populations. Panels and
      notifications are pulled with a FHIR search of the Communication resource
      (GET /ext/v1/Communication) and returned as a Bundle of Patient, Organization,
      Practitioner, MedicationRequest, MedicationDispense, Medication, Condition and
      Communication resources, with CapabilityStatement and OperationOutcome available.
      Authentication is mutual TLS with a Surescripts-issued client certificate plus mandatory
      X-SENDER-UID and X-SENDER-UID-QUALIFIER headers. The guide templates the host as
      https://FQDN/ext/v1; the base URL recorded here is the host that appears throughout the
      provider's own published request/response examples, and a live TLS probe on 2026-08-15
      confirmed it serves a Surescripts-issued certificate for that name.
  - aid: surescripts:surescripts-formulary-download-api
    name: Surescripts Formulary Download API
    tags:
      - Formulary
      - NCPDP Formulary and Benefit
      - REST
      - File Download
    image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
    humanURL: https://docs.surescripts.com/formulary-download/guide
    baseURL: https://formulary.surescripts.net/formulary-download
    endpointsModeled: false
    properties:
      - url: https://docs.surescripts.com/formulary-download/guide
        type: Documentation
      - url: https://docs.surescripts.com/formulary-download/guide/api-details
        type: APIReference
      - url: https://docs.surescripts.com/formulary-download/guide/security-and-data-access
        type: Authentication
      - url: https://docs.surescripts.com/formulary-download/guide/document-change-log
        type: ChangeLog
    description: >-
      Four documented REST endpoints that let a technology vendor locate and download NCPDP
      Formulary and Benefit lists - GET /formulary/pbms, GET /formulary/listTypes,
      GET /formulary/lists (paged search by PBM, type, sub-type, version and publish/change
      date), and GET /formulary/pbms/{pbmId}/types/{type}[/subtypes/{subtype}]/lists/{list}/file
      which streams the formulary file itself. Supports both NCPDP F&B 3.0 and v60 and
      translates between them in either direction. Access is restricted by the mutual-TLS client
      certificate together with a required x-participant-id header; errors return a JSON body
      whose code is the HTTP status plus a two-digit sub-code.
  - aid: surescripts:surescripts-e-prescribing-api
    name: Surescripts E-Prescribing
    tags:
      - E-Prescribing
      - NCPDP SCRIPT
      - NewRx
      - CancelRx
    image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
    humanURL: https://docs.surescripts.com/eprescribing/home
    endpointsModeled: true
    properties:
      - url: https://docs.surescripts.com/eprescribing/home
        type: Documentation
      - url: https://docs.surescripts.com/eprescribing/guide
        type: APIReference
    description: Routes electronic prescriptions between prescribers and pharmacies over the NCPDP SCRIPT standard (version 2023011), supporting NewRx, RxRenewalRequest/Response, RxChangeRequest/Response, RxTransfer, RxFill, CancelRx, and Status/Error/Verify transactions, plus Electronic Prescribing for Controlled Substances (EPCS). Delivered via certified EHR and pharmacy system integrations, not a public REST endpoint - the transaction set is documented in the E-Prescribing Companion Guide on the Surescripts Developer Portal.
  - aid: surescripts:surescripts-eligibility-formulary-api
    name: Surescripts Eligibility and Formulary
    tags:
      - Eligibility
      - Formulary
      - Benefit
      - X12
    image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
    humanURL: https://docs.surescripts.com/eligibility/home
    endpointsModeled: true
    properties:
      - url: https://docs.surescripts.com/eligibility/home
        type: Documentation
      - url: https://docs.surescripts.com/eligibility/guide
        type: APIReference
      - url: https://docs.surescripts.com/formulary/home
        type: Documentation
    description: Verifies patient pharmacy benefit eligibility and returns formulary and benefit coverage details so prescribers see coverage and coverage alternatives in workflow. Eligibility rides X12 270 request / 271 response exchange through the network; formulary rides the NCPDP Formulary and Benefit standard. Companion guides for both are published on the Surescripts Developer Portal; the machine-callable download surface is catalogued separately as the Formulary Download API.
  - aid: surescripts:surescripts-real-time-prescription-benefit-api
    name: Surescripts Real-Time Prescription Benefit
    tags:
      - Real-Time Prescription Benefit
      - RTPB
      - Pricing
      - Cost Transparency
    image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
    humanURL: https://docs.surescripts.com/rtpb/home
    endpointsModeled: true
    properties:
      - url: https://docs.surescripts.com/rtpb/home
        type: Documentation
      - url: https://docs.surescripts.com/rtpb-providers/guide
        type: APIReference
    description: Returns patient-specific, real-time out-of-pocket drug cost, coverage status, and therapeutic alternatives at the point of prescribing, as a synchronous RTPBRequest/RTPBResponse pair. Implements the NCPDP Real-Time Prescription Benefit standard v13 XML schema and is exchanged through certified prescriber, pharmacy and PBM/payer systems. Companion guides for provider vendors, pharmacies and PBM/payers are published on the Surescripts Developer Portal; no public REST endpoint or OpenAPI exists.
  - aid: surescripts:surescripts-electronic-prior-authorization-api
    name: Surescripts Electronic Prior Authorization
    tags:
      - Prior Authorization
      - ePA
      - NCPDP SCRIPT
    image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
    humanURL: https://surescripts.com/prior-authorization-portal-resources
    endpointsModeled: true
    properties:
      - url: https://surescripts.com/prior-authorization-portal-resources
        type: Documentation
    description: Automates electronic prior authorization (ePA) between prescribers and PBMs/payers using the NCPDP SCRIPT ePA transaction set (PAInitiationRequest, PARequest, PAResponse, and related messages) alongside X12 278. Delivered in-workflow through certified systems; the transaction surface is modeled from the NCPDP SCRIPT ePA standard.
  - aid: surescripts:surescripts-clinical-direct-messaging-api
    name: Surescripts Clinical Direct Messaging
    tags:
      - Clinical Direct Messaging
      - Direct Secure Messaging
      - Interoperability
    image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
    humanURL: https://surescripts.com/what-we-do
    endpointsModeled: true
    properties:
      - url: https://surescripts.com/what-we-do
        type: Documentation
    description: Provides secure, HIPAA-compliant clinical message exchange (Direct Secure Messaging) for care coordination between providers, including transitions of care and referrals. Delivered over the Direct Standard through certified partners rather than a public REST API; Surescripts is DirectTrust-accredited as a HISP, Registration Authority and Certificate Authority.
  - aid: surescripts:surescripts-record-locator-exchange-api
    name: Surescripts Record Locator and Exchange
    tags:
      - Record Locator
      - Clinical Data Exchange
      - Interoperability
    image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
    humanURL: https://docs.surescripts.com/record-locator-exchange/home
    endpointsModeled: true
    properties:
      - url: https://docs.surescripts.com/record-locator-exchange/home
        type: Documentation
    description: Locates where a patient has clinical records across the network and enables retrieval of relevant clinical documents to inform care decisions. Delivered to certified participants through the network; the exchange surface is modeled and not publicly documented as a callable API.
