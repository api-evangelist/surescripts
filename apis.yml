name: Surescripts
kind: company
description: Surescripts operates the largest health information network in the United
  States, connecting prescribers, pharmacies, pharmacy benefit managers (PBMs), health
  plans, and health systems for e-prescribing, medication history, benefit and eligibility
  verification, electronic prior authorization, and clinical interoperability. Surescripts
  is a network operator rather than a public API provider - its transaction services
  run over NCPDP SCRIPT (NewRx, RxRenewal, RxChange, RxTransfer, RxFill, CancelRx),
  NCPDP Telecommunication, and X12 (270/271 eligibility, 278 prior authorization)
  standards. There is no self-serve developer portal, no published OpenAPI, and no
  free API keys; access is gated behind a Surescripts certification process (conformance
  testing against current NCPDP standards, plus DEA third-party audit for EPCS) or
  through a certified middleware/EHR partner. The service surfaces below are honestly
  modeled from Surescripts' published solution descriptions and the underlying NCPDP/X12
  transaction standards - endpoints are not publicly documented.
